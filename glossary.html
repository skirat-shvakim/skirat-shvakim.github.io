<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="כל המונחים שהופיעו בסקירות של בורסה בפיג'מה, בשפה פשוטה.">
<meta property="og:title" content="המילון · בורסה בפיג'מה">
<meta property="og:description" content="כל המונחים שהופיעו בסקירות של בורסה בפיג'מה, בשפה פשוטה.">
<meta property="og:image" content="https://skirat-shvakim.github.io/og.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Secular+One&display=swap">
<style>
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e1116);--panel:light-dark(#f4f6f9,#171c23);--card:light-dark(#ffffff,#1b2129);--ink:light-dark(#141a22,#eef1f5);--mute:light-dark(#556070,#98a2b3);--line:light-dark(#e6e9ef,#2a313b);--blue:light-dark(#0a5cff,#5b8cff);--amber:light-dark(#f5a400,#ffc23d);--red:light-dark(#c4321f,#ff7a6b);--green:light-dark(#00794a,#3ad08a);--tealc:light-dark(#007585,#3cc6d6);--mint:light-dark(#eaf1ff,#1a2436)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 "Heebo",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px;zoom:var(--z,1)}
h1,h2,.bt{font-family:"Secular One","Heebo",sans-serif;font-weight:400}
.skip{position:absolute;inset-inline-start:8px;top:-60px;z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;text-decoration:none}.skip:focus{top:8px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;margin:0 -16px 18px;padding:max(env(safe-area-inset-top),10px) 16px 10px;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-inline-end:auto}
.brand svg{width:36px;height:36px;flex:none}.bt{font-size:22px;line-height:1}.b2{color:var(--blue)}
.back{font-weight:700;color:var(--blue);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
h1{font-size:clamp(32px,7vw,44px);line-height:1.1;margin:10px 0 8px;text-wrap:balance}
.lead{color:var(--mute);font-size:18px;margin:0 0 22px}
h2{font-size:24px;line-height:1.2;margin:0 0 8px}
.card{background:var(--panel);border-radius:20px;padding:20px;margin-bottom:14px;border-inline-start:8px solid var(--c,var(--blue))}
.card p{margin:0 0 10px}.card p:last-child{margin:0}
.ex{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
.lbl{font-weight:700}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.foot{text-align:center;color:var(--mute);font-size:14px;margin-top:26px;line-height:1.7}
.foot a{color:inherit}
</style>
</head>
<body>
<a class="skip" href="#main">דלג לתוכן</a>
<div class="wrap">
<header class="top">
  <a class="brand" href="./" aria-label="בורסה בפיג'מה, לסקירה של היום"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#131d3b"/><circle cx="26.5" cy="11.5" r="6" fill="#ffd76a"/><circle cx="29.3" cy="9.6" r="5.3" fill="#131d3b"/><path d="M6 31 L13.5 24 L20 26 L32.5 17.5" fill="none" stroke="#4d86ff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="13.5" cy="24" r="3" fill="#131d3b" stroke="#f5b400" stroke-width="2.3"/><circle cx="32.5" cy="17.5" r="3" fill="#131d3b" stroke="#ff6a55" stroke-width="2.3"/></svg><span class="bt"><span class="b1">בורסה</span> <span class="b2">בפיג'מה</span></span></a>
  <a class="back" href="./">לסקירה של היום ›</a>
</header>
<main id="main">
<h1>המילון של בורסה בפיג'מה</h1>
<p class="lead" id="cnt">כל המונחים שהופיעו בסקירות, בשפה פשוטה.</p>
<label for="q" class="lbl" style="display:block;margin-bottom:6px">חיפוש מונח</label>
<input id="q" type="search" placeholder="למשל: ריבית, מדד, דולר" style="width:100%;font:16px Heebo,sans-serif;min-height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:18px">
<div id="list" aria-live="polite"></div>
<noscript><p>כדי לראות את המילון יש להפעיל JavaScript.</p></noscript>
<style>
.gl h2{font-size:28px;color:var(--blue);margin:22px 0 8px}
.gl dl{margin:0}.gl dt{font-weight:800;font-size:18px;margin-top:12px}.gl dd{margin:2px 0 0;color:var(--ink)}
.gl .item{padding:12px 16px;border-radius:14px;background:var(--panel);margin-bottom:8px}
</style>
<script>
{
  const list=document.getElementById('list'),q=document.getElementById('q'),cnt=document.getElementById('cnt');let all=[];
  const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const draw=()=>{const s=q.value.trim();const f=all.filter(x=>!s||x.term.includes(s)||x.def.includes(s));
    if(!f.length){list.innerHTML='<p>לא נמצא מונח כזה. אולי הוא עוד לא הופיע בסקירה.</p>';return}
    const groups={};f.forEach(x=>{const k=/^[֐-׿]/.test(x.term)?x.term[0]:'A–Z';(groups[k]=groups[k]||[]).push(x)});
    list.innerHTML='<div class="gl">'+Object.keys(groups).map(k=>`<h2>${k}</h2>`+groups[k].map(x=>`<div class="item"><dl><dt>${esc(x.term)}</dt><dd>${esc(x.def)}</dd></dl></div>`).join('')).join('')+'</div>'};
  fetch('glossary.json?d='+Date.now()).then(r=>r.json()).then(d=>{all=d.sort((a,b)=>a.term.localeCompare(b.term,'he'));cnt.textContent=`${all.length} מונחים שהופיעו בסקירות, בשפה פשוטה. המילון גדל בכל יום.`;draw()}).catch(()=>{list.innerHTML='<p>לא הצלחנו לטעון את המילון. נסה לרענן.</p>'});
  q.addEventListener('input',draw);
}
</script>
</main>
<p class="foot"><a href="./">הסקירה של היום</a> · <a href="start.html">התחל כאן</a> · <a href="glossary.html">מילון</a> · <a href="accessibility.html">הצהרת נגישות</a><br>המידע באתר הוא מידע כללי ולימודי בלבד ואינו מהווה ייעוץ השקעות.</p>
</div>
<script>{let z=1;try{z=[1,1.15,1.3][+localStorage.getItem('tsz')||0]||1}catch(e){}document.documentElement.style.setProperty('--z',z)}</script>

</body>
</html>
